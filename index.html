<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宠物APP设计 v0.3 · 宠友星球 v5</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; min-height: 100%; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: #241a1f;
      background: #f6f2ef;
      overflow: hidden;
    }
    button { font: inherit; border: 0; cursor: pointer; }

    /* ============ 顶部框架 ============ */
    .topbar {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      gap: 20px; min-height: 84px; padding: 0 30px;
      border-bottom: 1px solid rgba(255, 107, 91, .16);
      background: rgba(255, 255, 255, .94);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 32px rgba(120, 40, 30, .08);
    }
    .brand h1 { margin: 0; font-size: 22px; color: #E8503F; }
    .brand p { margin: 6px 0 0; color: #7b6c70; font-size: 13px; }
    .terminal-switch, .screen-switch { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .terminal-switch button, .screen-switch button {
      height: 40px; padding: 0 16px; border-radius: 999px;
      color: #6d5d61; background: #f4ebe8; border: 1px solid transparent; transition: .18s ease;
    }
    .terminal-switch button.active {
      color: #fff; background: linear-gradient(135deg, #FF6B5B, #FF9A3C);
      box-shadow: 0 8px 18px rgba(255, 107, 91, .3);
    }
    .screen-switch {
      position: sticky; top: var(--topbar-height, 84px); z-index: 45;
      padding: 16px 30px; background: rgba(246, 242, 239, .96);
      border-bottom: 1px solid rgba(255, 107, 91, .12); backdrop-filter: blur(10px);
    }
    .screen-switch button.active {
      color: #E8503F; background: #fff; border-color: rgba(255, 107, 91, .28);
      box-shadow: 0 8px 20px rgba(120, 40, 30, .09);
    }
    .stage {
      height: calc(100vh - var(--chrome-height, 148px));
      min-height: 0; min-width: 0; overflow: auto; padding: 30px;
      display: flex; align-items: flex-start; justify-content: center;
    }

    /* ============ 画板缩放 ============ */
    .fit-shell { position: relative; flex: 0 0 auto; margin: 0 auto; }
    .fit-content { width: max-content; transform: scale(var(--fit-scale, 1)); transform-origin: top left; transition: transform .18s ease; }
    .device-label {
      display: flex; align-items: center; justify-content: space-between;
      width: var(--device-width); min-width: 260px; margin-bottom: 14px; color: #6a5a5e; font-size: 16px;
    }
    .fit-shell > .device-label { width: max(100%, 260px); margin-left: 50%; transform: translateX(-50%); }
    .device-label strong { display: inline-flex; align-items: center; color: #E8503F; white-space: nowrap; }
    .device-label > span { white-space: nowrap; }
    .proto-code {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 64px; height: 28px; margin-right: 10px; padding: 0 10px;
      border-radius: 999px; color: #fff; background: linear-gradient(135deg, #FF6B5B, #7C6BFF);
      font-size: 16px; font-weight: 950; letter-spacing: .4px; white-space: nowrap;
      box-shadow: 0 8px 18px rgba(124, 107, 255, .22);
    }
    .device {
      position: relative; width: var(--device-width); height: var(--device-height);
      overflow: hidden; background: #fffaf8; box-shadow: 0 24px 80px rgba(80, 34, 28, .2);
    }
    .device.mobile { --device-width: 1080px; --device-height: 1920px; border-radius: 46px; border: 18px solid #1A1B2E; }
    .device.pc { --device-width: 1920px; --device-height: 1080px; border-radius: 14px; border: 1px solid #d9dde4; display: flex; }

    /* ============ iOS 外壳 ============ */
    .phone-status {
      display: flex; align-items: center; justify-content: space-between;
      height: 74px; padding: 0 46px; font-size: 26px; font-weight: 700; color: #241a1f;
    }
    .phone-status .notch { width: 190px; height: 34px; border-radius: 999px; background: #1A1B2E; }
    .phone-nav {
      position: relative; display: flex; align-items: center; justify-content: center;
      height: 96px; padding: 0 34px; font-size: 34px; font-weight: 700;
      border-bottom: 1px solid rgba(36, 26, 31, .07);
      background: rgba(255, 255, 255, .72); backdrop-filter: blur(20px);
    }
    .phone-nav .back {
      position: absolute; left: 26px; width: 64px; height: 64px; border-radius: 999px;
      color: #FF6B5B; background: rgba(255, 107, 91, .1); font-size: 40px; line-height: 1;
    }
    .phone-nav .nav-act { position: absolute; right: 30px; font-size: 26px; color: #FF6B5B; background: none; }
    .phone-body { position: relative; height: calc(1920px - 74px - 96px - 150px); overflow: hidden; }
    .phone-body.no-tab { height: calc(1920px - 74px - 96px); }
    .phone-body.full { height: calc(1920px - 74px); }
    .scroll { height: 100%; overflow: hidden; padding: 30px 34px 40px; }
    .scroll.tight { padding: 0; }

    /* 深色沉浸式屏（雷达 / AI） */
    .dark-body { background: linear-gradient(178deg, #1A1B2E 0%, #241a3d 52%, #3a2440 100%); color: #fff; }
    .dark-nav { background: rgba(26, 27, 46, .6); color: #fff; border-bottom-color: rgba(255, 255, 255, .1); }
    .dark-status { color: #fff; }
    .dark-status .notch { background: #000; }

    /* ============ iOS 底部 Tab ============ */
    .bottom-tab {
      position: absolute; bottom: 0; left: 0; right: 0; height: 150px;
      display: flex; align-items: flex-start; padding: 16px 20px 0;
      border-top: 1px solid rgba(36, 26, 31, .08);
      background: rgba(255, 255, 255, .82); backdrop-filter: blur(24px);
    }
    .bottom-tab button {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px;
      background: none; color: #9b8d90; font-size: 20px; font-weight: 600;
    }
    .bottom-tab button.active { color: #FF6B5B; }
    .bottom-tab .tab-ico { font-size: 40px; line-height: 1; }
    .bottom-tab button.center { position: relative; }
    .bottom-tab button.center .tab-ico {
      display: flex; align-items: center; justify-content: center;
      width: 92px; height: 92px; margin-top: -34px; border-radius: 30px; color: #fff;
      background: linear-gradient(135deg, #FF6B5B, #FF9A3C); font-size: 52px; font-weight: 300;
      box-shadow: 0 14px 30px rgba(255, 107, 91, .42);
    }
    .bottom-tab.dark { background: rgba(26, 27, 46, .78); border-top-color: rgba(255, 255, 255, .1); }
    .bottom-tab.dark button { color: rgba(255, 255, 255, .5); }
    .bottom-tab.dark button.active { color: #FF8A7B; }

    /* ============ 通用组件 ============ */
    .sec-title { display: flex; align-items: center; justify-content: space-between; margin: 34px 0 18px; font-size: 32px; font-weight: 800; }
    .sec-title:first-child { margin-top: 0; }
    .sec-title span.more { font-size: 24px; font-weight: 600; color: #FF6B5B; }
    .card {
      padding: 26px 28px; border-radius: 28px; background: #fff;
      box-shadow: 0 12px 30px rgba(80, 34, 28, .07); border: 1px solid rgba(36, 26, 31, .04);
    }
    .card + .card { margin-top: 20px; }
    .glass {
      background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .26);
      backdrop-filter: blur(26px); border-radius: 28px;
    }
    .row { display: flex; align-items: center; gap: 20px; }
    .row.between { justify-content: space-between; }
    .grow { flex: 1; min-width: 0; }
    .muted { color: #8d7f83; }
    .dark-body .muted { color: rgba(255, 255, 255, .58); }
    .f20 { font-size: 20px; } .f22 { font-size: 22px; } .f24 { font-size: 24px; }
    .f26 { font-size: 26px; } .f28 { font-size: 28px; } .f32 { font-size: 32px; }
    .f40 { font-size: 40px; } .f56 { font-size: 56px; }
    .b7 { font-weight: 700; } .b8 { font-weight: 800; }
    .mt10 { margin-top: 10px; } .mt16 { margin-top: 16px; } .mt24 { margin-top: 24px; }

    .avatar {
      display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
      width: 96px; height: 96px; border-radius: 999px; font-size: 50px;
      background: linear-gradient(135deg, #FFE2DC, #FFD1A8);
    }
    .avatar.sm { width: 72px; height: 72px; font-size: 38px; }
    .avatar.lg { width: 160px; height: 160px; font-size: 84px; }
    .avatar.ring { box-shadow: 0 0 0 6px rgba(255, 255, 255, .9), 0 10px 24px rgba(80, 34, 28, .16); }

    .chip {
      display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 22px;
      border-radius: 999px; background: #FFF0ED; color: #E8503F; font-size: 22px; font-weight: 700;
    }
    .chip.mint { background: #E4F8F4; color: #199C83; }
    .chip.amber { background: #FFF4E0; color: #C9821A; }
    .chip.violet { background: #EFECFF; color: #6354E0; }
    .chip.plain { background: #F4EFEC; color: #6d5d61; }
    .chip.sm { height: 40px; padding: 0 16px; font-size: 19px; }
    .dark-body .chip.plain { background: rgba(255, 255, 255, .14); color: rgba(255, 255, 255, .8); }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; height: 100px; border-radius: 28px; color: #fff; font-size: 30px; font-weight: 800;
      background: linear-gradient(135deg, #FF6B5B, #FF9A3C); box-shadow: 0 14px 28px rgba(255, 107, 91, .32);
    }
    .btn.ghost { color: #E8503F; background: #FFF0ED; box-shadow: none; }
    .btn.violet { background: linear-gradient(135deg, #7C6BFF, #A78BFF); box-shadow: 0 14px 28px rgba(124, 107, 255, .34); }
    .btn.mint { background: linear-gradient(135deg, #34D4B8, #22B39A); box-shadow: 0 14px 28px rgba(52, 212, 184, .3); }
    .btn.sm { height: 76px; font-size: 26px; border-radius: 22px; }
    .btn.line { color: #6d5d61; background: #fff; border: 2px solid rgba(36, 26, 31, .12); box-shadow: none; }

    .field {
      display: flex; align-items: center; gap: 16px; height: 104px; padding: 0 28px;
      border-radius: 26px; background: #F5F0ED; color: #241a1f; font-size: 28px;
    }
    .field .ph { color: #a9999d; }
    .field + .field { margin-top: 20px; }
    .field .unit { color: #FF6B5B; font-size: 24px; font-weight: 700; }

    .list-item {
      display: flex; align-items: center; gap: 20px; padding: 24px 0;
      border-bottom: 1px solid rgba(36, 26, 31, .07);
    }
    .list-item:last-child { border-bottom: 0; }
    .badge-dot { min-width: 40px; height: 40px; padding: 0 12px; border-radius: 999px; background: #FF3B30; color: #fff; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; }

    .flame { display: inline-flex; align-items: center; gap: 6px; padding: 0 16px; height: 44px; border-radius: 999px; background: #FFF4E0; color: #C9821A; font-size: 21px; font-weight: 800; }
    .flame.gold { background: linear-gradient(135deg, #FFD86B, #FFB840); color: #6b3d00; }

    .bar { height: 16px; border-radius: 999px; background: rgba(36, 26, 31, .08); overflow: hidden; }
    .bar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #FF6B5B, #FFB840); }

    /* 雷达 */
    .radar-wrap { position: relative; height: 900px; display: flex; align-items: center; justify-content: center; }
    .radar-ring { position: absolute; border-radius: 999px; border: 2px solid rgba(255, 107, 91, .22); }
    .radar-sweep {
      position: absolute; width: 760px; height: 760px; border-radius: 999px;
      background: conic-gradient(from 0deg, rgba(255, 107, 91, .45), rgba(255, 107, 91, 0) 42%);
      animation: spin 3s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .radar-self {
      position: relative; z-index: 3; width: 176px; height: 176px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center; font-size: 92px;
      background: linear-gradient(135deg, #FF6B5B, #FF9A3C); box-shadow: 0 0 0 12px rgba(255, 107, 91, .18), 0 0 60px rgba(255, 107, 91, .55);
    }
    .radar-pin {
      position: absolute; z-index: 2; width: 108px; height: 108px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center; font-size: 54px;
      background: rgba(255, 255, 255, .92); box-shadow: 0 8px 26px rgba(0, 0, 0, .4);
      animation: breathe 2s ease-in-out infinite;
    }
    .radar-pin small {
      position: absolute; bottom: -34px; left: 50%; transform: translateX(-50%);
      font-size: 19px; color: rgba(255, 255, 255, .82); white-space: nowrap; font-weight: 700;
    }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

    /* 地图 */
    .map-canvas {
      position: relative; height: 100%; overflow: hidden;
      background: #EAEBE6;
    }

    /* 城市底图：直接使用《背景-地图.jpg》 */
    .geo-map {
      position: absolute; inset: 0; z-index: 0;
      background: url("背景-地图.jpg") center / cover no-repeat;
    }
    /* 雷达页为深色沉浸式（方案 2.1.1），底图压暗并向四周淡出，避让雷达扫描层 */
    .geo-map.dark {
      filter: saturate(.55) brightness(.42) contrast(1.05);
      -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 40%, rgba(0, 0, 0, .4) 66%, transparent 84%);
      mask-image: radial-gradient(circle at 50% 50%, #000 40%, rgba(0, 0, 0, .4) 66%, transparent 84%);
    }
    .heat {
      position: absolute; border-radius: 999px; filter: blur(26px); mix-blend-mode: multiply;
    }
    .heat.hot { background: radial-gradient(circle, rgba(255,107,91,.92), rgba(255,107,91,0) 70%); }
    .heat.mid { background: radial-gradient(circle, rgba(255,184,64,.9), rgba(255,184,64,0) 70%); }
    .heat.low { background: radial-gradient(circle, rgba(52,212,184,.85), rgba(52,212,184,0) 70%); }
    .cluster {
      position: absolute; display: flex; align-items: center; justify-content: center;
      border-radius: 999px; color: #fff; font-weight: 900; border: 5px solid rgba(255,255,255,.92);
      box-shadow: 0 10px 24px rgba(40, 60, 80, .3);
    }
    .map-pin {
      position: absolute; display: flex; align-items: center; justify-content: center;
      width: 92px; height: 92px; border-radius: 999px 999px 999px 6px; transform: rotate(-45deg);
      background: #fff; box-shadow: 0 10px 24px rgba(40, 60, 80, .32); border: 4px solid #FF6B5B;
    }
    .map-pin > span { transform: rotate(45deg); font-size: 44px; }
    .map-float {
      position: absolute; display: flex; flex-direction: column; gap: 14px;
      right: 30px; top: 30px;
    }
    .map-float .mbtn {
      width: 88px; height: 88px; border-radius: 24px; display: flex; align-items: center; justify-content: center;
      font-size: 40px; background: rgba(255, 255, 255, .9); backdrop-filter: blur(18px);
      box-shadow: 0 8px 22px rgba(40, 60, 80, .18); color: #3d4b58;
    }
    .legend {
      position: absolute; left: 30px; top: 30px; padding: 20px 24px; border-radius: 24px;
      background: rgba(255, 255, 255, .88); backdrop-filter: blur(18px); box-shadow: 0 10px 26px rgba(40,60,80,.16);
      font-size: 21px; font-weight: 700; color: #3d4b58;
    }
    .legend .bandbar { width: 240px; height: 16px; border-radius: 999px; margin: 12px 0 8px; background: linear-gradient(90deg, #34D4B8, #FFB840, #FF6B5B); }
    .sheet {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 34px 34px;
      border-radius: 36px 36px 0 0; background: rgba(255, 255, 255, .93); backdrop-filter: blur(26px);
      box-shadow: 0 -14px 40px rgba(40, 60, 80, .18);
    }
    .sheet .grab { width: 96px; height: 10px; border-radius: 999px; background: rgba(36,26,31,.16); margin: 0 auto 20px; }
    .hscroll { display: flex; gap: 18px; overflow: hidden; }
    .hcard { flex: 0 0 300px; padding: 22px; border-radius: 26px; background: #fff; box-shadow: 0 10px 24px rgba(80,34,28,.08); }

    /* 聊天 */
    .chat-wrap { height: 100%; display: flex; flex-direction: column; background: #F6F2EF; }
    .chat-scroll { flex: 1; overflow: hidden; padding: 30px 34px; }
    .msg { display: flex; gap: 18px; margin-bottom: 30px; }
    .msg .bubble { max-width: 620px; padding: 24px 28px; border-radius: 28px; font-size: 27px; line-height: 1.5; background: #fff; box-shadow: 0 8px 20px rgba(80,34,28,.06); }
    .msg.me { flex-direction: row-reverse; }
    .msg.me .bubble { color: #fff; background: linear-gradient(135deg, #FF6B5B, #FF8A5B); }
    .msg.ai .bubble { color: #fff; background: rgba(124, 107, 255, .34); border: 1px solid rgba(255,255,255,.24); backdrop-filter: blur(14px); }
    .chat-input {
      display: flex; align-items: center; gap: 16px; padding: 24px 30px 30px;
      background: rgba(255,255,255,.9); backdrop-filter: blur(20px); border-top: 1px solid rgba(36,26,31,.07);
    }
    .chat-input .box { flex: 1; height: 92px; border-radius: 26px; background: #F1ECE9; display: flex; align-items: center; padding: 0 26px; color: #a9999d; font-size: 27px; }
    .chat-input .cbtn { width: 92px; height: 92px; border-radius: 999px; background: #F1ECE9; display: flex; align-items: center; justify-content: center; font-size: 40px; }

    /* AI 形象 */
    .ai-hero { display: flex; flex-direction: column; align-items: center; padding: 34px 0 20px; }
    .ai-orb {
      width: 300px; height: 300px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
      font-size: 150px; background: linear-gradient(135deg, rgba(124,107,255,.9), rgba(255,107,91,.7));
      box-shadow: 0 0 0 16px rgba(124,107,255,.14), 0 0 90px rgba(124,107,255,.6);
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-22px); } }
    .live-dot { display: inline-flex; align-items: center; gap: 10px; }
    .live-dot i { width: 18px; height: 18px; border-radius: 999px; background: #34D4B8; box-shadow: 0 0 14px #34D4B8; }

    /* 弹层 / 蒙层 */
    .overlay { position: absolute; inset: 0; background: rgba(20, 12, 16, .55); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 60px; }
    .overlay.bottom { align-items: flex-end; padding: 0; }
    .modal { width: 100%; padding: 44px 40px; border-radius: 40px; background: #fff; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
    .modal.sheet-modal { border-radius: 40px 40px 0 0; text-align: left; }
    .ios-alert { width: 620px; padding: 40px 36px 0; border-radius: 32px; background: rgba(255,255,255,.96); backdrop-filter: blur(20px); text-align: center; overflow: hidden; }
    .ios-alert .acts { display: flex; margin: 34px -36px 0; border-top: 1px solid rgba(36,26,31,.12); }
    .ios-alert .acts button { flex: 1; height: 104px; background: none; font-size: 30px; color: #FF6B5B; font-weight: 700; }
    .ios-alert .acts button + button { border-left: 1px solid rgba(36,26,31,.12); }
    .spark-burst { display: flex; align-items: center; justify-content: center; gap: 24px; }
    .spark-burst .fx { font-size: 70px; animation: breathe 1.4s ease-in-out infinite; }

    /* 打卡 / 发布 */
    .up-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .up-box { height: 210px; border-radius: 24px; background: #F5F0ED; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #a9999d; font-size: 22px; }
    .up-box.filled { background: linear-gradient(135deg, #FFE2DC, #FFD1A8); color: #E8503F; font-size: 66px; }
    .pub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .pub-card { padding: 34px 26px; border-radius: 30px; text-align: left; background: #fff; box-shadow: 0 12px 30px rgba(80,34,28,.08); }
    .pub-card .ico { font-size: 60px; }

    /* 评分分布 */
    .score-row { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; font-size: 21px; color: #8d7f83; }
    .score-row .bar { flex: 1; height: 14px; }
    .vote { display: flex; gap: 16px; }
    .vote .v { flex: 1; padding: 24px; border-radius: 26px; text-align: center; }
    .vote .v.good { background: #E4F8F4; color: #199C83; }
    .vote .v.bad { background: #F4EFEC; color: #7b6c70; }

    /* 排行 */
    .rank-no { width: 62px; font-size: 32px; font-weight: 900; color: #c4b6b9; text-align: center; }
    .rank-no.top { color: #FF6B5B; }

    /* 我的 */
    .profile-hero { position: relative; height: 480px; padding: 40px 34px; color: #fff; background: linear-gradient(140deg, #FF6B5B, #FF9A3C 55%, #FFB840); }
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; text-align: center; }
    .stat-grid b { display: block; font-size: 38px; }
    .stat-grid span { font-size: 21px; opacity: .82; }
    .setting-row { display: flex; align-items: center; gap: 18px; padding: 28px 0; border-bottom: 1px solid rgba(36,26,31,.07); font-size: 28px; }
    .setting-row:last-child { border-bottom: 0; }
    .setting-row .arw { color: #c4b6b9; font-size: 30px; }
    .switch { width: 92px; height: 52px; border-radius: 999px; background: #34D4B8; position: relative; flex: 0 0 auto; }
    .switch::after { content: ""; position: absolute; top: 5px; right: 5px; width: 42px; height: 42px; border-radius: 999px; background: #fff; }
    .switch.off { background: #DCD5D2; }
    .switch.off::after { right: auto; left: 5px; }
    .danger-text { color: #FF3B30; }

    /* 平台端小工具 */
    function tag(text) {
      const danger = /驳回|封禁|违规|高危|熄灭|失败|冻结|下架/.test(text);
      const warn = /待|审核|复核|疑似|观察|灰度|限流/.test(text);
      const info = /进行|已发布|生效|正常运行/.test(text);
      return `<span class="tag ${danger ? "danger" : warn ? "warn" : info ? "info" : ""}">${text}</span>`;
    }
    function table(heads, rows, lastIsTag = true) {
      return `<table class="table"><thead><tr>${heads.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${
        rows.map(r => `<tr>${r.map((c, i) => {
          if (i === r.length - 1) return `<td><span class="lnk">${c}</span></td>`;
          if (lastIsTag && i === r.length - 2) return `<td>${tag(c)}</td>`;
          return `<td>${c}</td>`;
        }).join("")}</tr>`).join("")
      }</tbody></table>`;
    }
    function heatCells(n, seed) {
      let out = "";
      for (let i = 0; i < n; i++) {
        const v = (Math.sin((i + seed) * 1.7) + 1) / 2;
        const c = v > .72 ? "#FF6B5B" : v > .48 ? "#FFB840" : v > .26 ? "#34D4B8" : "#E6EAF2";
        out += `<i style="background:${c};opacity:${(0.45 + v * 0.55).toFixed(2)}"></i>`;
      }
      return out;
    }

            <div style="height:130px;background:#fafafa;border-radius:8px;padding:12px;display:flex;align-items:flex-end;gap:6px">${Array.from({length:14},(_,i)=>`<div class="bar" style="flex:1;height:${Math.max(8,60-i*4)}%;background:#14A37F;border-radius:3px"></div>`).join("")}</div>
            <div class="muted" style="font-size:12px;margin-top:6px">D1 38% · D7 22% · D14 15%</div>
          </div>
        </div>
        <div class="pc-panel" style="margin-top:14px">
          <h3>事件字典治理（24 事件 / source of truth）<span class="tag" style="margin-left:8px">CI 校验通过</span></h3>
          ${table(["事件","版本","采样","同意门控"], [["app_launch","v2","全量","—"],["location_share","v1","全量","位置·碰面"],["face_verify","v1","全量","人脸活体"],["audit_reject","v1","全量","—"]], false)}
          <div class="muted" style="font-size:12px;margin-top:8px">同意门控 · 留存销毁（合规类 ≥6月 / 业务 13月 / 页面 3月 / 错误 90天）· CI 比对 + 数据对账 + 看板下线机制</div>
        </div>`, [["导出","pbtn"]]),

      risk: () => pcPage("风控与审计", ["首页", "安全", "风控与审计"], `
        <div class="pc-cols" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
          <div class="pc-panel">
            <h3>异常检测规则</h3>
            ${table(["维度","阈值","处置"], [["虚拟定位","mock/速度>200km/h","会话 invalid"],["围栏漂出",">3次","REVOKED"],["离线",">5min","REVOKED"],["互赞刷量","频次异常","经验回滚"],["机器邀请","批量实名","拒绝+处罚"]], false)}
          </div>
          <div class="pc-panel">
            <h3>今日拦截</h3>
            <div class="kpis" style="grid-template-columns:repeat(2,1fr);margin:0">${[["虚拟定位","7"],["围栏异常","12"],["刷量回滚","3"],["敏感词","1,027"]].map(k=>`<div class="kpi"><span>${k[0]}</span><b style="color:#FF6B5B">${k[1]}</b></div>`).join("")}</div>
          </div>
        </div>
        <div class="pc-panel">
          <h3>违规处置队列</h3>
          ${table(["用户","违规类型","违规分","处置","操作"], [["U10025","刷量","2","观察","加重"],["U10027","辱骂","5","限流","加重"],["U10030","虚拟定位","8","封禁碰面7天","加重"]])}
          <div class="muted" style="margin-top:10px;font-size:12px">阶梯处罚 · 作弊不污染实名认证 · 敏感词违规只存 hash · 全量操作审计留存 6 月</div>
        </div>`, [["规则配置","pbtn"]])
    };function render() {
      document.getElementById("terminalSwitch").innerHTML = terminals.map(t =>
        `<button class="${state.terminal === t.id ? "active" : ""}" data-terminal="${t.id}">${t.name} · ${t.size}</button>`
      ).join("");
      document.getElementById("screenSwitch").innerHTML = screens[state.terminal].map(s =>
        `<button class="${state.screen === s[0] ? "active" : ""}" data-go="${s[0]}">${s[1]}</button>`
      ).join("");
      const stage = document.getElementById("stage");
      const views = state.terminal === "ios" ? iosViews : platformViews;
      const screen = views[state.screen] ? state.screen : Object.keys(views)[0];
      state.screen = screen;
      stage.innerHTML = views[screen]();
      fitPrototypeToViewport();
      requestAnimationFrame(fitPrototypeToViewport);
    }

    function updateChromeMetrics() {
      const topbar = document.querySelector(".topbar");
      const screenSwitch = document.getElementById("screenSwitch");
      const th = Math.ceil(topbar.getBoundingClientRect().height);
      const sh = Math.ceil(screenSwitch.getBoundingClientRect().height);
      document.documentElement.style.setProperty("--topbar-height", `${th}px`);
      document.documentElement.style.setProperty("--chrome-height", `${th + sh}px`);
    }

    function fitPrototypeToViewport() {
      updateChromeMetrics();
      const stage = document.getElementById("stage");
      const shell = stage.querySelector(".fit-shell");
      const content = shell && shell.querySelector(".fit-content");
      if (!shell || !content) return;
      content.style.setProperty("--fit-scale", 1);
      const st = window.getComputedStyle(stage);
      const padX = parseFloat(st.paddingLeft) + parseFloat(st.paddingRight);
      const padY = parseFloat(st.paddingTop) + parseFloat(st.paddingBottom);
      const safetyGap = stage.clientWidth < 700 ? 48 : 16;
      const aw = Math.max(260, stage.clientWidth - padX - safetyGap);
      const ah = Math.max(260, stage.clientHeight - padY - safetyGap);
      const nw = content.offsetWidth, nh = content.offsetHeight;
      const label = shell.querySelector(".device-label");
      const lh = label ? label.offsetHeight + parseFloat(window.getComputedStyle(label).marginBottom || 0) : 0;
      // 以视口高度为主适配，整体尽量可见；最低 0.5 倍保证可读，上限 1:1
      const scale = Math.max(0.5, Math.min(aw / nw, (ah - lh) / nh, 1));
      content.style.setProperty("--fit-scale", scale.toFixed(4));
      shell.style.width = `${Math.ceil(nw * scale)}px`;
      shell.style.height = `${Math.ceil(lh + nh * scale)}px`;
    }

    document.addEventListener("click", e => {
      const tb = e.target.closest("[data-terminal]");
      if (tb) { const t = tb.dataset.terminal; go(t, screens[t][0][0]); return; }
      const gb = e.target.closest("[data-go]");
      if (gb) go(state.terminal, gb.dataset.go);
    });

    render();
    window.addEventListener("resize", fitPrototypeToViewport);
    window.addEventListener("orientationchange", fitPrototypeToViewport);
    window.addEventListener("load", fitPrototypeToViewport);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitPrototypeToViewport);
    setTimeout(fitPrototypeToViewport, 0);
    setTimeout(fitPrototypeToViewport, 120);
  </script>
</body>
</html>
